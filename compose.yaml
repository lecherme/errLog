# Local development only (task 1.1). No public ingress: only `web` is published,
# and only on host loopback (default 127.0.0.1:3100; override with
# ERRLOG_WEB_PORT). POSTGRES_PASSWORD must come from the shell environment at run
# time; never commit it.
name: errlog-dev

services:
  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:${ERRLOG_WEB_PORT:-3100}:3000"
    networks:
      - errlog
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  pdf-processing:
    build: ./services/pdf-processing
    networks:
      - errlog
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the shell environment (never commit it)}
    networks:
      - errlog
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

networks:
  errlog: {}
